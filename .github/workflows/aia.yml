name: AIA Backup Files

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # 03:17 UTC Sun/Wed/Sat; off the hour, as GitHub delays (or drops) jobs queued at :00
    - cron: '17 3 * * 0,3,6'

permissions:
  contents: write

jobs:
  run-and-commit-aia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: generated
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the size check below needs origin/aia
          persist-credentials: true  # the publish step pushes with these
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r aia/requirements.txt
      - name: Run the script(s)
        run: python aia/get_pointing_table.py
      - name: Check the new table is not smaller than the published one
        shell: bash
        run: |
          # sort -u: older published tables had duplicate rows at the yearly chunk boundaries
          old=$(git show origin/aia:generated/aia_pointing_table.csv | sort -u | wc -l)
          new=$(wc -l < "$OUTPUT_DIR/aia_pointing_table.csv")
          if [ "$new" -lt "$old" ]; then
            echo "::error::New table has $new lines but the published one has $old; not publishing."
            exit 1
          fi
      - name: Publish generated output(s)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORKTREE_DIR="$(mktemp -d)"
          git worktree add --detach "$WORKTREE_DIR"

          pushd "$WORKTREE_DIR" >/dev/null
            # Start a brand-new orphan branch (no parents/history)
            git switch --orphan "aia"

            # Ensure a clean tree, then stage generated output and static files
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            mkdir -p "$OUTPUT_DIR"
            rsync -a --delete "$OLDPWD/$OUTPUT_DIR"/ "$OUTPUT_DIR"/
            mkdir -p "static"
            rsync -a --delete "$OLDPWD/aia/static"/ "static"/

            git add -A
            SHORT_SHA="$(echo "${GITHUB_SHA:-}" | cut -c1-7)"
            git commit -m "chore: publish generated output from ${SHORT_SHA} (single-commit) [skip ci]"
            git push -f origin "aia"
          popd >/dev/null

          git worktree remove "$WORKTREE_DIR" --force
